# Iron Gravel (web estática) en el minipc.
#   irongravel  nginx con ./public (solo en local, 127.0.0.1:8830)
#   tunnel      túnel con nombre -> irongravel.com / www (activo cuando el DNS apunte al túnel)
#   preview     túnel temporal *.trycloudflare.com para enseñarla mientras tanto (se puede quitar)
services:
  irongravel:
    image: nginx:1.27-alpine
    container_name: irongravel-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8830:80"
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: irongravel-tunnel
    restart: unless-stopped
    user: "1000:1000"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /home/s4sf/.cloudflared/4825a63f-fd33-4043-b2fe-a092799ff9de.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - irongravel

  preview:
    image: cloudflare/cloudflared:latest
    container_name: irongravel-preview
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://irongravel:80
    depends_on:
      - irongravel
