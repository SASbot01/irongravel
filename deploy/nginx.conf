# www.irongravel.com -> https://irongravel.com (la canónica va sin www, como en el WordPress original)
server {
    listen 80;
    server_name www.irongravel.com;
    return 301 https://irongravel.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    # Detrás del túnel nginx recibe http: las redirecciones van relativas (/contacto -> /contacto/)
    # para no mandar al visitante a http://
    absolute_redirect off;

    # PANTALLA DE MANTENIMIENTO
    #   1 = web cerrada: toda página responde 503 con /mantenimiento.html («Web en mantenimiento»).
    #       Las fotos y ficheros de /wp-content/ y robots.txt siguen saliendo.
    #   0 = web abierta.
    # Tras cambiarlo: docker exec irongravel-web nginx -s reload
    set $mantenimiento 1;
    error_page 503 /mantenimiento.html;
    recursive_error_pages on;
    location = /mantenimiento.html {
        internal;
        add_header Retry-After 86400 always;
        add_header Cache-Control "no-store" always;
    }
    location = /robots.txt { }

    # La URL temporal de vista previa no debe indexarse
    set $robots "";
    if ($host ~* "trycloudflare\.com$") { set $robots "noindex, nofollow"; }
    add_header X-Robots-Tag $robots always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/gpx+xml;

    location / {
        if ($mantenimiento) { return 503; }
        try_files $uri $uri/ =404;
    }
    location /wp-content/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag $robots always;
        try_files $uri =404;
    }
    location ~* \.gpx$ { default_type application/gpx+xml; add_header Content-Disposition attachment; }
}
