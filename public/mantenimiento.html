<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Gravel · Web en mantenimiento</title>
<meta name="description" content="Estamos realizando cambios en la web de Iron Gravel.">
<link rel="icon" href="/wp-content/uploads/2021/11/favicon-irongravel-03.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Molot"; font-display: swap; src: url(/wp-content/uploads/2023/09/Molot.woff) format("woff"); }
  @font-face { font-family: "BwModelica"; font-display: swap; font-weight: 400; src: url(/wp-content/uploads/2023/09/BwModelica-Regular.woff) format("woff"); }
  :root { --amarillo: #FFCA00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 20px;
    background: #000 url(/wp-content/uploads/2021/11/sliderinicio.jpg) no-repeat 60% center / cover;
    color: #fff;
    font-family: "BwModelica", system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    position: relative;
  }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); }
  main { position: relative; max-width: 760px; text-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
  h1 {
    font-family: "Molot", Impact, "Arial Black", sans-serif; font-weight: 400;
    text-transform: uppercase; line-height: 1.05; letter-spacing: .01em;
    font-size: clamp(2.1rem, 7vw, 4.4rem);
  }
  p { margin-top: 2rem; font-size: clamp(1.1rem, 2.6vw, 1.4rem); }
  img { display: block; width: 200px; max-width: 60%; height: auto; margin: 3rem auto 0; }
  nav { margin-top: 2.5rem; display: flex; gap: 1.75rem; justify-content: center; flex-wrap: wrap; }
  nav a {
    color: #fff; text-decoration: none; font-size: 1.15rem;
    border-bottom: 2px solid transparent; padding-bottom: 2px;
    transition: color .2s, border-color .2s;
  }
  nav a:hover, nav a:focus-visible { color: var(--amarillo); border-color: var(--amarillo); outline: none; }
</style>
</head>
<body>
<main>
  <h1>Web en mantenimiento</h1>
  <p>Estamos realizando cambios.</p>
  <img src="/wp-content/uploads/2021/11/iron-gravel.png" width="300" height="50" alt="Iron Gravel">
  <nav aria-label="Redes sociales">
    <a href="https://www.facebook.com/gravelalicante" rel="noopener">Facebook</a>
    <a href="https://www.instagram.com/iron_gravel_alicante/" rel="noopener">Instagram</a>
  </nav>
</main>
</body>
</html>
